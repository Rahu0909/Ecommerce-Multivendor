spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM2DDL:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
# JWT - must come from environment / secret store
spring.app.jwtSecret=${SPRING_APP_JWTSECRET:change-me}
spring.app.jwtExpirationMs=${SPRING_APP_JWTEXPIRATION_MS:3000000}
spring.app.jwtCookieName=${SPRING_APP_JWTCOOKIE_NAME:springBootEcom}
# Logging
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.com.project.ecommerce=${LOG_LEVEL_APP:DEBUG}
# Server port
server.port=${SERVER_PORT:5000}
project.image=images/